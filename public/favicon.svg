<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Opción B del artifact de propuestas: barras en alza. Mismo gradiente
       que el encabezado de la app (from-primary-600 to-indigo-600). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#grad)" />
  <rect x="8" y="17" width="4" height="7" rx="1.2" fill="#fff" />
  <rect x="14" y="12" width="4" height="12" rx="1.2" fill="#fff" />
  <rect x="20" y="7" width="4" height="17" rx="1.2" fill="#fff" />
</svg>
